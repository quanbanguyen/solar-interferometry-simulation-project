[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interfsim"
version = "0.2.0"
description = "End-to-end simulator for small radio interferometers: measured solar flux + simulated antenna beams -> voltages, correlator, u-v coverage and images."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Nguyen Ba Quan", email = "quan.nb224350@sis.hust.edu.vn" }]
keywords = ["radio astronomy", "interferometry", "solar radio", "simulation", "antenna", "NEC"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
notebooks = ["jupyter", "plotly>=5"]
dev = ["pytest>=7", "pytest-cov", "ruff>=0.5", "nbconvert", "ipykernel"]

[project.scripts]
interfsim = "interfsim.cli:main"

[project.urls]
Repository = "https://github.com/quanbanguyen/solar-interferometry-simulation-project"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["legacy", "thesis", "_archive", "notebooks", "tools", "toolmophong_APSYNSIM_trengithub"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]   # l/m/I are the standard symbols for direction cosines / in-phase
